<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ナンプレ</title>
  
  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ナンプレ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  
  <!-- アプリアイコン（SVG内包） -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%231976d2'><rect width='100' height='100' rx='20' fill='%23f4f7fb'/><text x='50' y='68' font-size='60' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%231976d2'>9</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%231976d2'><rect width='100' height='100' rx='20' fill='%23f4f7fb'/><text x='50' y='68' font-size='60' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%231976d2'>9</text></svg>">

  <style>
    :root {
      --primary: #1976d2;
      --selected-bg: #bbdefb;
      --related-bg: #e3f2fd;
      --match-num-bg: #cce5ff;
      --border-outer: #263238;
      --border-inner: #cfd8dc;
      --text-fixed: #263238;
      --text-user: #1976d2;
      --text-memo: #546e7a;
      --error-color: #d32f2f;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #333;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 16px env(safe-area-inset-bottom, 15px) 16px;
    }

    /* 上部ヘッダー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .header-icons {
      display: flex;
      gap: 16px;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
    }
    .stage-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #37474f;
    }

    /* ステータスバー */
    .status-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      margin-bottom: 6px;
    }
    .status-item .label {
      font-size: 0.7rem;
      color: #78909c;
      margin-bottom: 2px;
    }
    .status-item .val {
      font-size: 0.95rem;
      font-weight: 600;
      color: #455a64;
    }

    /* 9x9 グリッド */
    .board-container {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: 100%;
      height: 100%;
      border: 2px solid var(--border-outer);
      background-color: var(--border-inner);
      gap: 1px;
    }
    .cell {
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text-fixed);
    }

    /* 3x3ブロック枠線強調 */
    .cell:nth-child(3n) { border-right: 2px solid var(--border-outer); }
    .cell:nth-child(9n) { border-right: none; }
    .row-divider { border-bottom: 2px solid var(--border-outer) !important; }

    /* ハイライト */
    .cell.related { background-color: var(--related-bg); }
    .cell.match-num { background-color: var(--match-num-bg); }
    .cell.selected { background-color: var(--selected-bg) !important; }
    .cell.user-input { color: var(--text-user); font-weight: 600; }
    .cell.error { color: var(--error-color) !important; }

    /* メモ (候補数字) 3x3 表示 */
    .memo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .memo-digit {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.65rem;
      color: var(--text-memo);
      font-weight: 600;
    }

    /* コントロールボタン群 */
    .controls {
      display: flex;
      justify-content: space-around;
      padding: 6px 0;
    }
    .tool-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #546e7a;
      font-size: 0.75rem;
    }
    .tool-btn svg {
      width: 26px;
      height: 26px;
      stroke: #546e7a;
      stroke-width: 1.8;
      fill: none;
    }
    .tool-btn.active svg { stroke: var(--primary); }
    .tool-btn.active span { color: var(--primary); font-weight: 700; }

    /* 数字キーパッド */
    .numpad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      padding-bottom: 8px;
    }
    .num-btn {
      background: none;
      border: none;
      aspect-ratio: 0.75;
      font-size: 1.7rem;
      font-weight: 500;
      color: var(--primary);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .num-btn:active {
      background-color: #f0f4f8;
    }
    .num-btn.completed {
      opacity: 0.15;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <div class="top-bar">
      <button class="icon-btn" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="stage-title">34/51</div>
      <div class="header-icons">
        <button class="icon-btn" id="restart-btn" aria-label="リセット">
          <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button class="icon-btn" aria-label="ポーズ">
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
      </div>
    </div>

    <!-- ステータス -->
    <div class="status-bar">
      <div class="status-item">
        <div class="label">通算</div>
        <div class="val">🏆 34,638</div>
      </div>
      <div class="status-item">
        <div class="label">難易度</div>
        <div class="val">エキスパート</div>
      </div>
      <div class="status-item">
        <div class="label">スコア</div>
        <div class="val">11,753</div>
      </div>
      <div class="status-item">
        <div class="label">間違い</div>
        <div class="val" id="mistakes-val">0/3</div>
      </div>
    </div>

    <!-- 盤面 -->
    <div class="board-container">
      <div class="grid" id="grid"></div>
    </div>

    <!-- ツールボタン -->
    <div class="controls">
      <button class="tool-btn" id="undo-btn">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
        <span>元に戻す</span>
      </button>
      <button class="tool-btn" id="erase-btn">
        <svg viewBox="0 0 24 24"><path d="M18 13l-5 5H4l4-4 9-9 5 5-4 4z"/></svg>
        <span>消す</span>
      </button>
      <button class="tool-btn" id="memo-btn">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span id="memo-status">メモ OFF</span>
      </button>
      <button class="tool-btn" id="hint-btn">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 6h8c1.5-1.5 3-3.5 3-6a7 7 0 0 0-7-7z"/></svg>
        <span>ヒント</span>
      </button>
    </div>

    <!-- 数字パッド -->
    <div class="numpad" id="numpad"></div>
  </div>

  <script>
    // 添付画像の初期盤面データ
    const INITIAL_BOARD = [
      [8, 9, 1, 4, 7, 3, 6, 5, 2],
      [7, 2, 6, 8, 5, 1, 9, 4, 3],
      [3, 4, 5, 9, 2, 6, 1, 7, 8],
      [1, 0, 2, 7, 3, 0, 8, 9, 0],
      [0, 7, 9, 6, 0, 0, 2, 3, 1],
      [0, 3, 8, 2, 1, 9, 0, 0, 7],
      [9, 1, 3, 5, 0, 0, 7, 2, 0],
      [0, 8, 7, 3, 0, 2, 0, 1, 9],
      [2, 0, 4, 1, 9, 7, 3, 8, 0]
    ];

    // 画像内の初期メモ
    const INITIAL_MEMOS = {
      "3,1": [5], "3,5": [4, 5], "3,8": [4, 5],
      "4,0": [4, 5], "4,4": [4, 8], "4,5": [4, 5, 8],
      "5,0": [4, 5], "5,6": [4, 5],
      "6,4": [4, 8], "6,5": [4, 6, 8], "6,8": [4],
      "7,0": [5], "7,4": [4, 6], "7,6": [4, 5],
      "8,1": [5], "8,8": [5]
    };

    let board = JSON.parse(JSON.stringify(INITIAL_BOARD));
    let memos = JSON.parse(JSON.stringify(INITIAL_MEMOS));
    let selectedCell = { r: 4, c: 3 }; // 画像で選択されている [4,3] の '6' を初期選択
    let isMemoMode = false;
    let history = [];
    let mistakes = 0;

    const gridEl = document.getElementById('grid');
    const numpadEl = document.getElementById('numpad');
    const memoBtn = document.getElementById('memo-btn');
    const memoStatus = document.getElementById('memo-status');
    const mistakesEl = document.getElementById('mistakes-val');

    function init() {
      renderBoard();
      renderNumpad();
      setupEvents();
    }

    function renderBoard() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (r === 2 || r === 5) cell.classList.add('row-divider');

          const val = board[r][c];
          const isInitial = INITIAL_BOARD[r][c] !== 0;

          if (val !== 0) {
            cell.textContent = val;
            if (!isInitial) cell.classList.add('user-input');
          } else {
            const key = `${r},${c}`;
            if (memos[key] && memos[key].length > 0) {
              const mg = document.createElement('div');
              mg.className = 'memo-grid';
              for (let i = 1; i <= 9; i++) {
                const md = document.createElement('div');
                md.className = 'memo-digit';
                if (memos[key].includes(i)) md.textContent = i;
                mg.appendChild(md);
              }
              cell.appendChild(mg);
            }
          }

          // ハイライト判定
          if (selectedCell) {
            const selVal = board[selectedCell.r][selectedCell.c];
            if (selectedCell.r === r && selectedCell.c === c) {
              cell.classList.add('selected');
            } else if (
              selectedCell.r === r ||
              selectedCell.c === c ||
              (Math.floor(selectedCell.r / 3) === Math.floor(r / 3) && Math.floor(selectedCell.c / 3) === Math.floor(c / 3))
            ) {
              cell.classList.add('related');
            }
            if (selVal !== 0 && val === selVal) {
              cell.classList.add('match-num');
            }
          }

          cell.addEventListener('click', () => {
            selectedCell = { r, c };
            renderBoard();
            updateNumpad();
          });

          gridEl.appendChild(cell);
        }
      }
    }

    function renderNumpad() {
      numpadEl.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = i;
        btn.addEventListener('click', () => handleInput(i));
        numpadEl.appendChild(btn);
      }
      updateNumpad();
    }

    function updateNumpad() {
      const counts = Array(10).fill(0);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (board[r][c] !== 0) counts[board[r][c]]++;
        }
      }
      const buttons = numpadEl.querySelectorAll('.num-btn');
      buttons.forEach((btn, idx) => {
        const num = idx + 1;
        if (counts[num] >= 9) {
          btn.classList.add('completed');
        } else {
          btn.classList.remove('completed');
        }
      });
    }

    function handleInput(num) {
      if (!selectedCell) return;
      const { r, c } = selectedCell;
      if (INITIAL_BOARD[r][c] !== 0) return; // 初期固定マスは編集不可

      saveState();

      if (isMemoMode) {
        const key = `${r},${c}`;
        if (!memos[key]) memos[key] = [];
        const index = memos[key].indexOf(num);
        if (index > -1) {
          memos[key].splice(index, 1);
        } else {
          memos[key].push(num);
        }
      } else {
        board[r][c] = (board[r][c] === num) ? 0 : num;
      }
      renderBoard();
      updateNumpad();
    }

    function saveState() {
      history.push({
        board: JSON.parse(JSON.stringify(board)),
        memos: JSON.parse(JSON.stringify(memos))
      });
      if (history.length > 20) history.shift();
    }

    function setupEvents() {
      // メモモード切替
      memoBtn.addEventListener('click', () => {
        isMemoMode = !isMemoMode;
        memoBtn.classList.toggle('active', isMemoMode);
        memoStatus.textContent = isMemoMode ? 'メモ ON' : 'メモ OFF';
      });

      // 消去
      document.getElementById('erase-btn').addEventListener('click', () => {
        if (!selectedCell) return;
        const { r, c } = selectedCell;
        if (INITIAL_BOARD[r][c] !== 0) return;
        saveState();
        board[r][c] = 0;
        delete memos[`${r},${c}`];
        renderBoard();
        updateNumpad();
      });

      // 元に戻す
      document.getElementById('undo-btn').addEventListener('click', () => {
        if (history.length === 0) return;
        const last = history.pop();
        board = last.board;
        memos = last.memos;
        renderBoard();
        updateNumpad();
      });

      // リセット
      document.getElementById('restart-btn').addEventListener('click', () => {
        if (confirm('最初からやり直しますか？')) {
          board = JSON.parse(JSON.stringify(INITIAL_BOARD));
          memos = JSON.parse(JSON.stringify(INITIAL_MEMOS));
          history = [];
          renderBoard();
          updateNumpad();
        }
      });
    }

    // オフライン化のための Service Worker 自己登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swScript = `
          const CACHE_NAME = 'sudoku-pwa-v1';
          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll([self.location.href]))
            );
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        const blob = new Blob([swScript], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch((err) => {
          console.log('SW registration fallback/skip:', err);
        });
      });
    }

    init();
  </script>
</body>
</html>
